  <script>
  document.querySelectorAll('a[href*=".mp4"]').forEach((link) => {
    const image = link.querySelector('img');
    if (!image) return;
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'position:relative; aspect-ratio:16 / 9; background:#000; overflow:hidden;';
    const preview = image.cloneNode(true);
    preview.style.cssText = 'position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; z-index:1;';
    const video = document.createElement('video');
    video.src = link.href;
    video.poster = image.src;
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.setAttribute('aria-label', link.getAttribute('aria-label') || 'Film abspielen');
    video.style.cssText = 'position:relative; z-index:2; width:100%; height:100%; object-fit:contain; background:transparent; display:block; opacity:0;';
    wrapper.addEventListener('click', () => { if (video.paused) video.play().catch(() => {}); });
    video.addEventListener('play', () => { preview.style.display = 'none'; video.style.opacity = '1'; video.style.background = '#000'; });
    wrapper.append(preview, video);
    link.replaceWith(wrapper);
  });
  </script>
